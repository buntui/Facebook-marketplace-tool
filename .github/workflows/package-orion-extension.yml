name: Package Orion extension
on:
  push:
    branches: ["codex/orion-zero-cost"]
    paths: ["extension/**", ".github/workflows/package-orion-extension.yml"]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd extension && zip -r ../deal-finder-orion-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: deal-finder-orion-extension
          path: deal-finder-orion-extension.zip
